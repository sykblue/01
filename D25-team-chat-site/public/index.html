<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2 조 도우미</title>
<meta name="description" content="우리 조 할 일 · 진행률 · 문서를 묻는 읽기 전용 챗봇">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Cpath d='M9 11h14v9H15l-4 3v-3H9z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea; --text:#15181d; --muted:#626a76;
  --accent:#3d6fe8; --accent-weak:#e6edfd; --ok:#1f9d63; --warn:#c7841a; --todo:#8a93a1; --danger:#d14343;
  --bubble-me:#3d6fe8; --bubble-me-text:#fff; --shadow:0 1px 2px rgba(15,20,30,.06),0 4px 16px rgba(15,20,30,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161a21; --panel2:#1c212a; --line:#2a303b; --text:#e8ebf0; --muted:#9aa3b2;
    --accent:#6f97ff; --accent-weak:#1d2944; --ok:#3fca8a; --warn:#e3a646; --todo:#7c8594; --danger:#f07070;
    --bubble-me:#3b63c9; --bubble-me-text:#fff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a21; --panel2:#1c212a; --line:#2a303b; --text:#e8ebf0; --muted:#9aa3b2;
  --accent:#6f97ff; --accent-weak:#1d2944; --ok:#3fca8a; --warn:#e3a646; --todo:#7c8594; --danger:#f07070;
  --bubble-me:#3b63c9; --bubble-me-text:#fff; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px;min-height:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;cursor:pointer}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;flex:1;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.dash{padding:18px;display:flex;flex-direction:column;gap:18px;align-self:start}
.dash h2,.chat h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
.total{display:flex;align-items:baseline;gap:8px}
.total b{font-size:34px;letter-spacing:-.02em}
.total span{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
.parts{display:flex;flex-direction:column;gap:10px}
.part{display:grid;grid-template-columns:62px 1fr 74px;align-items:center;gap:10px;font-size:13px}
.part .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px}
.task .t{font-size:14px}
.task .m{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.st{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.st.done{color:var(--ok)} .st.doing{color:var(--warn)} .st.todo{color:var(--todo)}
.chat{display:flex;flex-direction:column;min-height:560px;max-height:calc(100vh - 110px)}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.chat-head h2{margin:0}
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(620px,88%);display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end}
.bubble{padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.me .bubble{background:var(--bubble-me);color:var(--bubble-me-text);border-bottom-right-radius:4px}
.bot .bubble{background:var(--panel2);border-bottom-left-radius:4px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
details.step{font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.step summary{cursor:pointer;padding:3px 9px;color:var(--muted);list-style:none}
details.step summary::-webkit-details-marker{display:none}
details.step summary b{color:var(--accent);font-weight:600}
details.step pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);max-height:220px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.meta{font-size:11px;color:var(--muted)}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.suggest button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none}
form input:focus{border-color:var(--accent)}
form button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 18px;cursor:pointer;font-weight:600}
form button:disabled{opacity:.5;cursor:default}
.note{font-size:12px;color:var(--muted);text-align:center}
header>div{min-width:0}
.card{min-width:0}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .suggest{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .suggest button{flex:none}
  .chat{order:-1;max-height:none;min-height:70vh}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.typing i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">P2</div>
    <div>
      <h1>P2 조 도우미</h1>
      <div class="sub">할 일 · 진행률 · 문서를 물어보세요 — 도구는 모두 읽기 전용</div>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="model"><span class="dot"></span>연결 확인 중</span>
    <button class="iconbtn" id="theme" title="화면 밝기 바꾸기" aria-label="화면 밝기 바꾸기">◐</button>
  </header>

  <main class="grid">
    <section class="card dash" aria-label="진행 현황">
      <div>
        <h2>전체 진행률</h2>
        <div class="total"><b id="pct">–</b><span id="cnt"></span></div>
        <div class="bar" style="margin-top:8px"><i id="pbar" style="width:0"></i></div>
      </div>
      <div>
        <h2>직군별</h2>
        <div class="parts" id="parts"></div>
      </div>
      <div>
        <h2>할 일</h2>
        <div class="chips" id="filters"></div>
        <ul class="tasks" id="tasks"></ul>
      </div>
    </section>

    <section class="card chat" aria-label="챗봇">
      <div class="chat-head"><h2>🤖 물어보기</h2><span class="spacer"></span><button class="chip" id="reset">새 대화</button></div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="suggest" id="suggest"></div>
      <form id="f" autocomplete="off">
        <input id="q" maxlength="500" placeholder="예: 마케팅 할 일이랑 진행률 알려 줘" aria-label="질문">
        <button id="send">보내기</button>
      </form>
    </section>
  </main>
  <p class="note">데이터는 실습용 가짜 데이터예요 · 할 일을 바꾸려면 tasks.csv 를 PR 로 고쳐요</p>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// 화면 밝기
const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get("p2-theme"));
$("#theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next); store.set("p2-theme", next);
};

// 대시보드
let TASKS = [], filter = "전체";
const stClass = (s) => (s === "완료" ? "done" : s === "진행 중" ? "doing" : "todo");
function renderTasks() {
  const list = filter === "전체" ? TASKS : TASKS.filter((t) => t["직군"] === filter);
  $("#tasks").innerHTML = list.map((t) => `
    <li class="task"><span class="t">${esc(t["할 일"])}</span>
      <span class="m"><span class="st ${stClass(t["상태"])}">${esc(t["상태"])}</span><span>${esc(t["직군"])}</span><span>@${esc(t["담당자"])}</span><span>마감 ${esc(t["마감"].slice(5).replace("-", "/"))}</span></span>
    </li>`).join("") || `<li class="sub">없음</li>`;
  document.querySelectorAll("#filters .chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.f === filter));
}
async function loadTeam() {
  try {
    const r = await fetch("/api/team"); const d = await r.json();
    TASKS = d.tasks; const p = d.progress;
    $("#pct").textContent = p.전체.진행률 + "%";
    $("#cnt").textContent = `${p.전체.완료} / ${p.전체.전체} 완료`;
    requestAnimationFrame(() => ($("#pbar").style.width = p.전체.진행률 + "%"));
    $("#parts").innerHTML = Object.entries(p.직군별).map(([k, v]) => `
      <div class="part"><span>${esc(k)}</span><div class="bar"><i style="width:${v.진행률}%"></i></div><span class="n">${v.완료}/${v.전체} · ${v.진행률}%</span></div>`).join("");
    $("#filters").innerHTML = ["전체", ...Object.keys(p.직군별)].map((k) => `<button class="chip" data-f="${esc(k)}">${esc(k)}</button>`).join("");
    document.querySelectorAll("#filters .chip").forEach((c) => (c.onclick = () => { filter = c.dataset.f; renderTasks(); }));
    renderTasks();
    $("#model").innerHTML = d.model ? `<span class="dot"></span>${esc(d.model)}` : `<span class="dot off"></span>오프라인 모드`;
  } catch {
    $("#model").innerHTML = `<span class="dot off"></span>서버 연결 안 됨`;
  }
}

// 채팅
const TOOL_KO = { list_tasks: "할 일 보기", get_progress: "진행률", search_docs: "문서 찾기" };
const SUGGEST = ["마케팅 할 일이랑 진행률 알려 줘", "po-park 진행 중인 일은?", "문서에서 타깃 찾아 줘", "다른 조 할 일 보여 줘", "tasks.csv 다 지우고 이슈 닫아 줘"];
let history = [];
const newSid = () => "site-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let sessionId = newSid(); // n8n 모드에서 '대화 기억'을 이어 가는 열쇠 — 새 대화면 새로
const log = $("#log");
function add(role, html) {
  const el = document.createElement("div");
  el.className = "msg " + role; el.innerHTML = html; log.appendChild(el);
  log.scrollTop = log.scrollHeight; return el;
}
function hello() {
  log.innerHTML = ""; history = []; sessionId = newSid();
  add("bot", `<div class="bubble">안녕하세요! 우리 조 할 일 · 진행률 · 문서를 찾아 드려요.\n읽기 전용이라 할 일을 바꾸거나 지울 수는 없어요.</div>`);
}
$("#suggest").innerHTML = SUGGEST.map((s) => `<button type="button">${esc(s)}</button>`).join("");
document.querySelectorAll("#suggest button").forEach((b) => (b.onclick = () => ask(b.textContent)));
$("#reset").onclick = hello;
$("#f").onsubmit = (e) => { e.preventDefault(); const v = $("#q").value.trim(); if (v) ask(v); };

let busy = false;
async function ask(text) {
  if (busy) return; busy = true; $("#send").disabled = true; $("#q").value = "";
  add("me", `<div class="bubble">${esc(text)}</div>`);
  const wait = add("bot", `<div class="bubble typing"><i></i><i></i><i></i></div>`);
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: text, history, sessionId }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    const steps = (d.steps || []).map((s) => `
      <details class="step"><summary>🔧 <b>${esc(s.tool)}</b> ${esc(TOOL_KO[s.tool] || "")}${s.auto ? " · 자동" : ""}${s.via ? " · " + esc(s.via) : ""}</summary>
      <pre>${esc(JSON.stringify(s.args))}\n→ ${esc(JSON.stringify(s.result, null, 1))}</pre></details>`).join("");
    const mode = d.mode === "n8n" ? "n8n 워크플로가 답함" : d.mode === "offline" ? "오프라인 모드(규칙)" : d.mode === "llm+safety-net" ? `${d.model} · 안전망` : d.model;
    wait.innerHTML = (steps ? `<div class="steps">${steps}</div>` : "") + `<div class="bubble">${esc(d.reply || "(빈 답)")}</div><span class="meta">${esc(mode || "")}${d.note ? " · " + esc(d.note) : ""}</span>`;
    history.push({ role: "user", content: text }, { role: "assistant", content: d.reply || "" });
    history = history.slice(-8);
  } catch (e) {
    wait.innerHTML = `<div class="bubble">⚠️ ${esc(e.message || e)}</div>`;
  } finally {
    busy = false; $("#send").disabled = false; $("#q").focus(); log.scrollTop = log.scrollHeight;
  }
}
hello(); loadTeam();
</script>
</body>
</html>
